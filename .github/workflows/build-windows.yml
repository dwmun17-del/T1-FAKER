name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TrainingManager.csproj

      - name: Publish single-file Windows executable
        run: >-
          dotnet publish TrainingManager.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Add documentation to package
        shell: pwsh
        run: |
          Copy-Item "사용안내.txt" "publish/사용안내.txt"
          Compress-Archive -Path "publish/*" -DestinationPath "TrainingManager-Windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrainingManager-Windows-x64
          path: TrainingManager-Windows-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "TrainingManager-Windows-x64.zip" --generate-notes --title "$env:GITHUB_REF_NAME"
